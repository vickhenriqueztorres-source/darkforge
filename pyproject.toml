[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darkforge-channel-os"
version = "0.1.0"
description = "DarkForge Channel OS - Local-controlled, cloud-backed editorial intelligence station"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pyjwt>=2.9,<3.0",
  "cryptography>=43.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "playwright>=1.49,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "adapters*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live_supabase: requires live Supabase test project with DATABASE_URL and SUPABASE_SERVICE_ROLE_KEY",
]
